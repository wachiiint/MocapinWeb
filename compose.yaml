services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: mocapin
      POSTGRES_USER: mocapin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mocapin -d mocapin"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  postgres_data:
