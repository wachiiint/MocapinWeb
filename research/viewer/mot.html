<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MOT viewer</title>
  <style>
    :root { --bg: #fafafa; --fg: #222; --muted: #777; --grid: #e2e2e2; --card: #fff;
            --r: #d9480f; --l: #1971c2; --c: #2f9e44; --p: #862e9c; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #18181b; --fg: #eee; --muted: #888; --grid: #2e2e32; --card: #202024;
              --r: #ff922b; --l: #4dabf7; --c: #69db7c; --p: #da77f2; }
    }
    * { box-sizing: border-box; }
    body { margin: 0; font: 14px system-ui, sans-serif; background: var(--bg); color: var(--fg);
           display: flex; flex-direction: column; height: 100vh; }
    header { display: flex; gap: 10px; align-items: center; padding: 10px 16px; flex-wrap: wrap;
             border-bottom: 1px solid var(--grid); }
    .tabs { display: flex; gap: 4px; }
    .tabs button { border: 1px solid var(--grid); background: var(--card); color: var(--fg);
                   padding: 4px 10px; border-radius: 6px; cursor: pointer; font: inherit; }
    .tabs button.active { background: var(--fg); color: var(--bg); border-color: var(--fg); }
    #info { color: var(--muted); font-variant-numeric: tabular-nums; margin-left: auto; }
    main { flex: 1; display: grid; grid-template-columns: 1fr 290px; min-height: 0; }
    @media (max-width: 820px) { main { grid-template-columns: 1fr; grid-template-rows: 1fr 220px; } }
    canvas { display: block; width: 100%; height: 100%; cursor: crosshair; }
    aside { border-left: 1px solid var(--grid); overflow-y: auto; background: var(--card); }
    table { width: 100%; border-collapse: collapse; font-size: 12px; font-variant-numeric: tabular-nums; }
    th, td { padding: 6px 10px; text-align: right; border-bottom: 1px solid var(--grid); }
    th:first-child, td:first-child { text-align: left; }
    th { position: sticky; top: 0; background: var(--card); color: var(--muted); font-weight: 600; }
    tr.item { cursor: pointer; }
    tr.item:hover { background: var(--bg); }
    tr.hidden { opacity: 0.38; }
    .swatch { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; }
  </style>
</head>
<body>
<header>
  <input type="file" id="file" accept=".mot">
  <div class="tabs" id="tabs"></div>
  <span id="info"></span>
</header>
<main>
  <canvas id="plot"></canvas>
  <aside>
    <table>
      <thead><tr><th>Joint</th><th>Min</th><th>Max</th><th>ROM</th></tr></thead>
      <tbody id="stats"></tbody>
    </table>
  </aside>
</main>
<script>
const GROUPS = {
  'Lower Limb': ['hip_flexion_r', 'hip_flexion_l', 'knee_angle_r', 'knee_angle_l', 'ankle_angle_r', 'ankle_angle_l'],
  'Pelvis': ['pelvis_tilt', 'pelvis_list', 'pelvis_rotation'],
  'Spine': ['L5_S1_Flex_Ext', 'L5_S1_Lat_Bending', 'L5_S1_axial_rotation'],
  'Upper Limb': ['arm_flex_r', 'arm_flex_l', 'elbow_flex_r', 'elbow_flex_l'],
  'All': null,
};

const canvas = document.getElementById('plot');
const ctx = canvas.getContext('2d');
const tabsEl = document.getElementById('tabs');
const statsEl = document.getElementById('stats');
const infoEl = document.getElementById('info');

let mot = null;           // { names, times, cols: number[][], inDegrees }
let group = 'Lower Limb';
let hidden = new Set();
let hoverIdx = null;

function parseMot(text) {
  const lines = text.split(/\r?\n/);
  const endIdx = lines.findIndex(l => l.trim().toLowerCase() === 'endheader');
  const inDegrees = lines.slice(0, endIdx).some(l => /inDegrees\s*=\s*yes/i.test(l));
  const names = lines[endIdx + 1].trim().split(/\s+/).slice(1);
  const rows = lines.slice(endIdx + 2).filter(l => l.trim()).map(l => l.trim().split(/\s+/).map(Number));
  const times = rows.map(r => r[0]);
  const cols = names.map((_, c) => rows.map(r => r[c + 1]));
  return { names, times, cols, inDegrees };
}

function visibleCols() {
  if (!mot) return [];
  const allow = GROUPS[group];
  return mot.names
    .map((name, idx) => ({ name, idx, vals: mot.cols[idx] }))
    .filter(c => !allow || allow.includes(c.name));
}

function colorFor(name, i, css) {
  if (name.endsWith('_r')) return css.getPropertyValue('--r').trim();
  if (name.endsWith('_l')) return css.getPropertyValue('--l').trim();
  const palette = [css.getPropertyValue('--c').trim(), css.getPropertyValue('--p').trim(), '#0ca678', '#e67700'];
  return palette[i % palette.length];
}

function renderTable() {
  const css = getComputedStyle(document.documentElement);
  const items = visibleCols();
  statsEl.innerHTML = '';
  items.forEach((c, i) => {
    const min = Math.min(...c.vals), max = Math.max(...c.vals);
    const tr = document.createElement('tr');
    tr.className = 'item' + (hidden.has(c.name) ? ' hidden' : '');
    const val = hoverIdx != null ? ` (${c.vals[hoverIdx].toFixed(1)})` : '';
    tr.innerHTML = `<td><span class="swatch" style="background:${colorFor(c.name, i, css)}"></span>${c.name}${val}</td>` +
      `<td>${min.toFixed(1)}</td><td>${max.toFixed(1)}</td><td>${(max - min).toFixed(1)}</td>`;
    tr.onclick = () => { hidden.has(c.name) ? hidden.delete(c.name) : hidden.add(c.name); draw(); renderTable(); };
    statsEl.appendChild(tr);
  });
}

function draw() {
  const w = canvas.clientWidth, h = canvas.clientHeight;
  canvas.width = w * devicePixelRatio; canvas.height = h * devicePixelRatio;
  ctx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0);
  ctx.clearRect(0, 0, w, h);
  if (!mot) return;

  const css = getComputedStyle(document.documentElement);
  const pad = { l: 52, r: 16, t: 18, b: 30 };
  const pw = w - pad.l - pad.r, ph = h - pad.t - pad.b;
  const active = visibleCols().filter(c => !hidden.has(c.name));
  const allVals = active.flatMap(c => c.vals);
  let yMin = allVals.length ? Math.min(...allVals) : -10;
  let yMax = allVals.length ? Math.max(...allVals) : 10;
  const yPad = Math.max((yMax - yMin) * 0.08, 2);
  yMin -= yPad; yMax += yPad;

  const t0 = mot.times[0], t1 = mot.times[mot.times.length - 1];
  const xOf = t => pad.l + ((t - t0) / (t1 - t0 || 1)) * pw;
  const yOf = v => pad.t + (1 - (v - yMin) / (yMax - yMin || 1)) * ph;

  ctx.strokeStyle = css.getPropertyValue('--grid'); ctx.fillStyle = css.getPropertyValue('--muted');
  ctx.font = '11px system-ui'; ctx.lineWidth = 1;
  for (let i = 0; i <= 4; i++) {
    const v = yMin + (i / 4) * (yMax - yMin), y = yOf(v);
    ctx.beginPath(); ctx.moveTo(pad.l, y); ctx.lineTo(w - pad.r, y); ctx.stroke();
    ctx.fillText(v.toFixed(0), 8, y + 4);
  }
  if (yMin < 0 && yMax > 0) {
    ctx.save(); ctx.setLineDash([4, 4]);
    ctx.beginPath(); ctx.moveTo(pad.l, yOf(0)); ctx.lineTo(w - pad.r, yOf(0)); ctx.stroke();
    ctx.restore();
  }
  ctx.fillText(`${t0.toFixed(2)} s`, pad.l, h - 8);
  ctx.fillText(`${t1.toFixed(2)} s`, w - pad.r - 36, h - 8);

  visibleCols().forEach((c, i) => {
    if (hidden.has(c.name)) return;
    ctx.strokeStyle = colorFor(c.name, i, css); ctx.lineWidth = 2;
    ctx.beginPath();
    c.vals.forEach((v, k) => k === 0 ? ctx.moveTo(xOf(mot.times[k]), yOf(v)) : ctx.lineTo(xOf(mot.times[k]), yOf(v)));
    ctx.stroke();
  });

  if (hoverIdx != null) {
    const x = xOf(mot.times[hoverIdx]);
    ctx.strokeStyle = css.getPropertyValue('--fg'); ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(x, pad.t); ctx.lineTo(x, h - pad.b); ctx.stroke();
    ctx.fillStyle = css.getPropertyValue('--fg');
    ctx.fillText(`t = ${mot.times[hoverIdx].toFixed(2)} s`, Math.min(x + 6, w - 80), pad.t + 12);
  }
  const unit = mot.inDegrees ? 'deg' : 'rad';
  infoEl.textContent = `${mot.times.length} frames · ${(t1 - t0).toFixed(2)} s · ${unit}`;
}

Object.keys(GROUPS).forEach(name => {
  const btn = document.createElement('button');
  btn.textContent = name;
  if (name === group) btn.className = 'active';
  btn.onclick = () => {
    group = name; hidden.clear();
    tabsEl.querySelectorAll('button').forEach(b => b.classList.toggle('active', b === btn));
    draw(); renderTable();
  };
  tabsEl.appendChild(btn);
});

document.getElementById('file').addEventListener('change', async e => {
  const file = e.target.files[0];
  if (!file) return;
  mot = parseMot(await file.text());
  hidden.clear(); hoverIdx = null;
  draw(); renderTable();
});

canvas.addEventListener('pointermove', e => {
  if (!mot) return;
  const rect = canvas.getBoundingClientRect();
  const frac = (e.clientX - rect.left - 52) / Math.max(rect.width - 68, 1);
  hoverIdx = Math.max(0, Math.min(mot.times.length - 1, Math.round(frac * (mot.times.length - 1))));
  draw(); renderTable();
});
canvas.addEventListener('pointerleave', () => { hoverIdx = null; draw(); renderTable(); });
window.addEventListener('resize', draw);
draw();
</script>
</body>
</html>
